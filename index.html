<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Experiments</title>
  <style>
    :root {
      --bg: #0a0a16;
      --card: #14142a;
      --accent: #35f2ff;
      --text: #eaf6ff;
      --muted: #8fa3b8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 32px 20px 64px;
    }
    header { max-width: 820px; margin: 0 auto 28px; text-align: center; }
    h1 { margin: 0 0 6px; font-size: 2rem; letter-spacing: 0.02em; }
    h1 .glow { color: var(--accent); text-shadow: 0 0 18px rgba(53, 242, 255, 0.55); }
    header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    #list {
      max-width: 820px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px;
    }
    a.card {
      display: flex; align-items: center; gap: 16px;
      background: var(--card); border: 1px solid #232342; border-radius: 14px;
      padding: 18px; text-decoration: none; color: var(--text);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    a.card:hover {
      transform: translateY(-2px); border-color: var(--accent);
      box-shadow: 0 8px 30px rgba(53, 242, 255, 0.15);
    }
    .qr img { display: block; width: 88px; height: 88px; border-radius: 10px; background: #fff; }
    .meta { flex: 1; min-width: 0; }
    .meta h2 { margin: 0 0 4px; font-size: 1.15rem; }
    .meta .open { color: var(--accent); font-size: 0.9rem; }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <h1>AR <span class="glow">Experiments</span></h1>
    <p>Open on a mobile device &mdash; camera access requires HTTPS.</p>
  </header>
  <main id="list">
    <p class="empty">Loading&hellip;</p>
  </main>
  <script>
    (async () => {
      const list = document.getElementById('list')
      try {
        const res = await fetch('manifest.json')
        const experiments = await res.json()
        if (!experiments.length) {
          list.innerHTML = '<p class="empty">No experiments yet.</p>'
          return
        }
        list.innerHTML = experiments.map((e) => {
          const url = new URL(e.path, window.location.href).href
          return `
            <a class="card" href="${e.path}">
              <div class="qr">
                <img alt="QR for ${e.title}"
                     src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}"
                     onerror="this.parentNode.style.display='none'">
              </div>
              <div class="meta">
                <h2>${e.title}</h2>
                <span class="open">Open &rarr;</span>
              </div>
            </a>`
        }).join('')
      } catch (err) {
        list.innerHTML = '<p class="empty">Could not load the experiment list.</p>'
      }
    })()
  </script>
</body>
</html>
